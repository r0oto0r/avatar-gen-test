<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Test</title>
<style>
  :root { --bg: #ffffff; --text: #1a1a1a; --muted: #6b6b6b; --line: #cfcfcf; --hover: #f2f2f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1c; --text: #f2f2f2; --muted: #a8a8a8; --line: #4a4a4a; --hover: #2a2a2a; }
  }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 16px; }
  .tile p { margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; font-size: 14px; color: var(--text); background: transparent;
           border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:hover { background: var(--hover); }
</style>
</head>
<body>
<main>
  <h1>Avatar Test</h1>
  <div class="grid">
    <div class="tile"><canvas id="hg0" width="320" height="320"></canvas><p>Hell getönt</p></div>
    <div class="tile"><canvas id="hg1" width="320" height="320"></canvas><p>Dunkel</p></div>
    <div class="tile"><canvas id="hg2" width="320" height="320"></canvas><p>Neutral</p></div>
    <div class="tile"><canvas id="hg3" width="320" height="320"></canvas><p>Dritte Farbe</p></div>
  </div>
  <div class="actions">
    <button id="pat">Neues Muster</button>
    <button id="col">Andere Farben</button>
  </div>
</main>
<script>
(function () {
  var S = 320, w = 24;

  // Each ramp: [very light, mid, very dark]
  var R = [
    ['#EEEDFE', '#7f77dd', '#26215c'], // purple
    ['#E1F5EE', '#1d9e75', '#04342c'], // teal
    ['#FAECE7', '#d85a30', '#4a1b0c'], // coral
    ['#FBEAF0', '#d4537e', '#4b1528'], // pink
    ['#E6F1FB', '#378add', '#042c53'], // blue
    ['#FAEEDA', '#ef9f27', '#412402']  // amber
  ];

  var seed = Math.floor(Math.random() * 1e9);
  var ci = [0, 5, 1]; // main color, second color, third color (ramp indices)

  // Seeded random generator (mulberry32): same seed, same avatar
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function drawAvatar(canvasId, bg) {
    var c = document.getElementById(canvasId).getContext('2d');
    var r = rng(seed);
    var pick = [R[ci[0]][1], R[ci[1]][1]];
    var cells = [];

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = bg;
    c.fillRect(0, 0, S, S);

    // Random triangle of 21 cells: 40% empty, 35% color 1, 25% color 2
    for (var y = 0; y < 6; y++) {
      for (var x = 0; x <= y; x++) {
        var v = r();
        if (v >= 0.4) cells.push([x, y, v < 0.75 ? 0 : 1]);
      }
    }

    // Mirror the triangle 8 ways around the center
    var flips = [[1, 1], [-1, 1], [1, -1], [-1, -1]];
    for (var sw = 0; sw < 2; sw++) {
      flips.forEach(function (s) {
        c.save();
        c.translate(S / 2, S / 2);
        c.scale(s[0], s[1]);
        if (sw) c.transform(0, 1, 1, 0, 0, 0);
        cells.forEach(function (q) {
          if (sw && q[0] === q[1]) return;
          c.fillStyle = pick[q[2]];
          c.fillRect(q[0] * w, q[1] * w, w, w);
        });
        c.restore();
      });
    }
  }

  function draw() {
    drawAvatar('hg0', R[ci[0]][0]); // light tint of main color
    drawAvatar('hg1', R[ci[0]][2]); // dark shade of main color
    drawAvatar('hg2', '#f1efe8');   // neutral
    drawAvatar('hg3', R[ci[2]][1]); // third color
  }

  document.getElementById('pat').onclick = function () {
    seed = Math.floor(Math.random() * 1e9);
    draw();
  };

  document.getElementById('col').onclick = function () {
    var a = [0, 1, 2, 3, 4, 5];
    for (var i = 5; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    ci = [a[0], a[1], a[2]];
    draw();
  };

  draw();
})();
</script>
</body>
</html>
