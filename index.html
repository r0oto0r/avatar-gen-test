<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Test</title>
<style>
  /* NerdQuiz app tokens: canvas, onCanvas, onCanvasMuted, surfaceRaised, accent */
  :root { --bg: #365387; --text: #ffffff; --muted: #C9D3E6; --box: #1F1F1F; --accent: #FF7C00; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 16px; }
  .tile p { margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  button { font: inherit; font-size: 14px; color: var(--text); background: var(--box);
           border: 0; border-radius: 16px; aspect-ratio: 2; cursor: pointer; }
  button:hover { background: var(--accent); color: #1F1F1F; }
</style>
</head>
<body>
<main>
  <h1>Avatar Test</h1>
  <div class="grid">
    <div class="tile"><canvas id="hg0" width="320" height="320"></canvas><p>Hell getönt</p></div>
    <div class="tile"><canvas id="hg1" width="320" height="320"></canvas><p>Dunkel</p></div>
    <div class="tile"><canvas id="hg2" width="320" height="320"></canvas><p>Neutral</p></div>
    <div class="tile"><canvas id="hg3" width="320" height="320"></canvas><p>Dritte Farbe</p></div>
    <div class="tile"><canvas id="hg4" width="320" height="320"></canvas><p>Dritte Farbe hell</p></div>
    <div class="tile"><canvas id="hg5" width="320" height="320"></canvas><p>Dritte Farbe dunkel</p></div>
    <button id="pat">Neues Muster</button>
    <button id="col">Andere Farben</button>
  </div>
</main>
<script>
(function () {
  var S = 320, w = 24;

  // Each ramp: [very light, mid, very dark]
  // NerdQuiz board column hues (nerdquiz-app theme.ts); tint/shade derived from them
  var R = [
    ['#FCE6DB', '#EA5B0C', '#4E0000'], // orange
    ['#D9F4FC', '#00B9EE', '#002F4F'], // cyan
    ['#F8D9E9', '#D1006C', '#400000'], // magenta
    ['#D9DEF2', '#0024AA', '#000025'], // blue
    ['#E9F4DF', '#6FB52C', '#092C00']  // green
  ];

  var seed = Math.floor(Math.random() * 1e9);
  var ci = [0, 1, 3]; // main color, second color, third color (ramp indices)

  // Seeded random generator (mulberry32): same seed, same avatar
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function drawAvatar(canvasId, bg) {
    var c = document.getElementById(canvasId).getContext('2d');
    var r = rng(seed);
    var pick = [R[ci[0]][1], R[ci[1]][1]];
    var cells = [];

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = bg;
    c.fillRect(0, 0, S, S);

    // Random triangle of 21 cells: 40% empty, 35% color 1, 25% color 2
    for (var y = 0; y < 6; y++) {
      for (var x = 0; x <= y; x++) {
        var v = r();
        if (v >= 0.4) cells.push([x, y, v < 0.75 ? 0 : 1]);
      }
    }

    // Mirror the triangle 8 ways around the center
    var flips = [[1, 1], [-1, 1], [1, -1], [-1, -1]];
    for (var sw = 0; sw < 2; sw++) {
      flips.forEach(function (s) {
        c.save();
        c.translate(S / 2, S / 2);
        c.scale(s[0], s[1]);
        if (sw) c.transform(0, 1, 1, 0, 0, 0);
        cells.forEach(function (q) {
          if (sw && q[0] === q[1]) return;
          c.fillStyle = pick[q[2]];
          c.fillRect(q[0] * w, q[1] * w, w, w);
        });
        c.restore();
      });
    }
  }

  function draw() {
    drawAvatar('hg0', R[ci[0]][0]); // light tint of main color
    drawAvatar('hg1', R[ci[0]][2]); // dark shade of main color
    drawAvatar('hg2', '#1F1F1F');   // app box surface
    drawAvatar('hg3', R[ci[2]][1]); // third color
    drawAvatar('hg4', R[ci[2]][0]); // light tint of third color
    drawAvatar('hg5', R[ci[2]][2]); // dark shade of third color
  }

  document.getElementById('pat').onclick = function () {
    seed = Math.floor(Math.random() * 1e9);
    draw();
  };

  document.getElementById('col').onclick = function () {
    var a = [0, 1, 2, 3, 4];
    for (var i = 4; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    ci = [a[0], a[1], a[2]];
    draw();
  };

  draw();
})();
</script>
</body>
</html>
